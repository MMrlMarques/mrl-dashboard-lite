<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mrl Stock & CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 p-8 font-sans">

  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-blue-400">Painel Executivo</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Total em Estoque -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
        <h2 class="text-xl font-semibold text-gray-400 mb-2">Total de Produtos</h2>
        <p id="total-produtos" class="text-4xl font-bold text-white">Carregando...</p>
      </div>

      <!-- Total de Clientes -->
      <div class="bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700">
        <h2 class="text-xl font-semibold text-gray-400 mb-2">Clientes Cadastrados</h2>
        <p id="total-clientes" class="text-4xl font-bold text-white">Carregando...</p>
      </div>

    </div>
  </div>

  <!-- O bagulho só funciona com esse type="module", não vai esquecer! -->
  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
